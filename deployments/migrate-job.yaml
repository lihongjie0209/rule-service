apiVersion: batch/v1
kind: Job
metadata:
  name: rule-service-migrate
  namespace: platform
  labels:
    app.kubernetes.io/name: rule-service
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rule-service
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/lihongjie0209/rule-service:main
          imagePullPolicy: IfNotPresent
          command: [/app/migrate]
          args: [-config, /app/config/config.yaml, -env, production, -direction, up]
          env:
            - name: APP_MIGRATION_PATH
              value: /app/migrations/postgres
            - name: APP_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rule-service
                  key: APP_DATABASE_DSN
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
