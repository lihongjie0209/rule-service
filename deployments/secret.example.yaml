apiVersion: v1
kind: Secret
metadata:
  name: rule-service
  namespace: platform
type: Opaque
stringData:
  # Copy this file outside source control, replace every value, then apply it.
  APP_DATABASE_DSN: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=rule_service
  APP_MIGRATION_DATABASE_URL: postgres://user:password@postgres:5432/platform?sslmode=require&search_path=rule_service
  APP_REDIS_ADDRESS: redis:6379
  APP_REDIS_PASSWORD: replace-me
  APP_AUTH_JWKS_URL: http://identity-service.platform.svc.cluster.local:8080/.well-known/jwks.json
  APP_AUTH_ISSUER: identity-service
  APP_AUTH_AUDIENCE: rule-service
  APP_AUTH_PSK_KEY: replace-with-at-least-32-random-bytes
